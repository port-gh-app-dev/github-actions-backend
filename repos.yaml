# Repositories the wiki sync keeps up to date.
#
# To enroll a repository:
#   1. Add an entry below and merge the change.
#   2. Give the sync token access to the repository (see the guide).
#   3. In Port, run "Generate wiki" once in full mode, then review and merge the PR.
#
# After step 3, the hourly sync keeps the wiki current. No other setup is needed.
#
# "service" must equal the Port identifier of the service entity.
repos:
  - name: port-gh-app-dev/payment-service
  - name: port-gh-app-dev/skills-registry-demo
  - name: port-gh-app-dev/broker-service
  - name: port-gh-app-dev/snyk-ecs
  - name: port-gh-app-dev/port-configuration
  - name: port-gh-app-dev/analytics-service
  - name: port-gh-app-dev/ads-service
  - name: port-gh-app-dev/admin-service
  - name: port-gh-app-dev/authentication-service
